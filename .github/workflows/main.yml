</resources>package com.mini.futbol;

import android.app.Activity;
import android.os.Bundle;
import android.graphics.*;
import android.view.*;
import android.content.Context;

import java.util.Random;

public class MainActivity extends Activity {

    @Override
    public void onCreate(Bundle b) {
        super.onCreate(b);

        getWindow().setFlags(
                WindowManager.LayoutParams.FLAG_FULLSCREEN,
                WindowManager.LayoutParams.FLAG_FULLSCREEN
        );

        setContentView(new GameView(this));
    }

    static class GameView extends View {

        Paint p = new Paint(Paint.ANTI_ALIAS_FLAG);
        Random rnd = new Random();

        float angle = 0;
        float power = 70;

        float shotX = .5f;
        float ballY = .82f;
        float keeperX = .5f;

        int goals = 0;
        int shots = 0;

        boolean shooting = false;
        boolean resultShown = false;

        long shotStart;

        String message =
                "Toca izquierda/derecha para apuntar. Toca abajo para tirar.";

        GameView(Context c) {
            super(c);
        }

        @Override
        protected void onDraw(Canvas c) {

            int w = getWidth();
            int h = getHeight();

            // CANCHA
            p.setStyle(Paint.Style.FILL);
            p.setColor(Color.rgb(83, 170, 75));

            c.drawRect(0, 0, w, h, p);

            // LÍNEAS
            p.setStyle(Paint.Style.STROKE);
            p.setStrokeWidth(4);
            p.setColor(Color.WHITE);

            c.drawRect(
                    w * .18f,
                    h * .07f,
                    w * .82f,
                    h * .93f,
                    p
            );

            // ÁREA
            c.drawRect(
                    w * .31f,
                    h * .07f,
                    w * .69f,
                    h * .25f,
                    p
            );

            // MEDIO CAMPO
            c.drawLine(
                    w * .18f,
                    h * .5f,
                    w * .82f,
                    h * .5f,
                    p
            );

            // TEXTO
            p.setStyle(Paint.Style.FILL);
            p.setTextAlign(Paint.Align.CENTER);
            p.setColor(Color.WHITE);

            p.setTextSize(28);

            c.drawText(
                    "⚽ MINI FÚTBOL",
                    w * .5f,
                    40,
                    p
            );

            p.setTextSize(20);

            c.drawText(
                    "Goles: " + goals + "   Tiros: " + shots,
                    w * .5f,
                    70,
                    p
            );

            // PORTERO
            p.setTextSize(42);

            c.drawText(
                    "🧤",
                    w * keeperX,
                    h * .18f,
                    p
            );

            // BALÓN
            p.setTextSize(38);

            c.drawText(
                    "⚽",
                    w * (shooting ? shotX : .5f),
                    h * (shooting ? ballY : .82f),
                    p
            );

            // MENSAJE
            p.setTextSize(20);

            c.drawText(
                    message,
                    w * .5f,
                    h - 65,
                    p
            );

            c.drawText(
                    "Dirección: " +
                            Math.round(angle) +
                            "°   Potencia: " +
                            Math.round(power) +
                            "%",
                    w * .5f,
                    h - 30,
                    p
            );

            // ANIMACIÓN DEL TIRO
            if (shooting && !resultShown) {

                float t =
                        Math.min(
                                1f,
                                (System.currentTimeMillis() - shotStart)
                                        / 550f
                        );

                ballY = .82f - .62f * t;

                if (t >= 1f) {
                    finishShot();
                } else {
                    invalidate();
                }
            }
        }

        @Override
        public boolean onTouchEvent(MotionEvent e) {

            if (e.getAction() != MotionEvent.ACTION_DOWN)
                return true;

            float x = e.getX();
            float y = e.getY();

            // BOTÓN DE DISPARO
            if (y > getHeight() * .82f) {
                shoot();
                return true;
            }

            // APUNTAR
            if (x < getWidth() * .5f) {

                angle = Math.max(
                        -35,
                        angle - 5
                );

            } else {

                angle = Math.min(
                        35,
                        angle + 5
                );
            }

            invalidate();

            return true;
        }

        void shoot() {

            if (shooting)
                return;

            shots++;

            shotX =
                    .5f +
                    (angle / 35f) * .24f;

            keeperX =
                    .2f +
                    rnd.nextFloat() * .6f;

            shooting = true;
            resultShown = false;

            shotStart =
                    System.currentTimeMillis();

            message = "¡Disparo!";

            invalidate();
        }

        void finishShot() {

            resultShown = true;

            boolean inside =
                    shotX >= .28f &&
                    shotX <= .72f;

            boolean powerOK =
                    power >= 55 &&
                    power <= 95;

            boolean saved =
                    Math.abs(
                            shotX - keeperX
                    ) < .10f;

            if (inside && powerOK && !saved) {

                goals++;

                message = "🔥 ¡GOOOOL!";

            } else if (saved) {

                message =
                        "🧤 ¡ATAJÓ EL PORTERO!";

            } else {

                message =
                        "❌ ¡Fallaste!";
            }

            shooting = false;

            ballY = .82f;

            invalidate();
        }
    }
}name: Build APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]

jobs:

  build:

    runs-on: ubuntu-latest

    steps:

      - name: Descargar código
        uses: actions/checkout@v4

      - name: Configurar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Configurar Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Compilar APK
        run: gradle assembleDebug

      - name: Guardar APK
        uses: actions/upload-artifact@v4
        with:
          name: Mini-Futbol-debug
          path: app/build/outputs/apk/debug/app-debug.apk
